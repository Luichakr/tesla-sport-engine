<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07080a">
<title>Sport Engine</title>
<style>
  :root {
    --bg: #07080a; --panel: #111318; --line: #22262e; --text: #e9edf2; --dim: #7c8594;
    --accent: #ff3b30; --amber: #ffb020; --green: #31d158;
    --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
    --ctrl-fs: 16px; --ctrl-pad: 11px 15px; --gap: 10px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow: hidden; user-select: none;
    -webkit-user-select: none; }
  #app { display: grid; grid-template-rows: auto 1fr auto; height: 100%; height: 100dvh; }
  header { display: flex; gap: var(--gap); align-items: center; flex-wrap: wrap;
    padding: 10px calc(14px + var(--sar)) 10px calc(14px + var(--sal)); padding-top: calc(10px + var(--sat));
    border-bottom: 1px solid var(--line); }
  footer { display: flex; gap: var(--gap); align-items: center; justify-content: space-between; flex-wrap: wrap;
    padding: 10px calc(14px + var(--sar)) calc(10px + var(--sab)) calc(14px + var(--sal));
    border-top: 1px solid var(--line); }
  .brand { font-weight: 800; letter-spacing: .16em; font-size: 15px; margin-right: auto; white-space: nowrap; }
  .brand b { color: var(--accent); }
  .controls { display: flex; gap: var(--gap); align-items: center; flex-wrap: wrap; }
  .actions { display: flex; gap: var(--gap); align-items: center; flex-wrap: wrap; }
  button, select { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 12px;
    padding: var(--ctrl-pad); font-size: var(--ctrl-fs); font-weight: 600; cursor: pointer; line-height: 1.1; }
  button.on { border-color: var(--accent); color: #fff; background: #2a0d0b; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.icon { padding: var(--ctrl-pad); }
  #gearBtn { display: none; }
  label.vol { display: flex; align-items: center; gap: 8px; color: var(--dim); font-size: 14px; white-space: nowrap; }
  input[type=range] { width: 120px; max-width: 32vw; accent-color: var(--accent); }
  #stage { position: relative; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .status { color: var(--dim); font-size: 13px; font-variant-numeric: tabular-nums; }
  .status .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--dim); margin-right: 6px; vertical-align: 1px; }
  .status .dot.ok { background: var(--green); } .status .dot.warn { background: var(--amber); }
  #pedals { display: none; gap: var(--gap); }
  #pedals.show { display: flex; flex: 1; justify-content: flex-end; }
  #pedals button { min-width: 110px; padding: 16px; font-size: 17px; touch-action: none; }
  #gas.down { background: var(--green); color: #000; }
  #brake.down { background: var(--accent); }
  #overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; background: rgba(7,8,10,.88); z-index: 2; text-align: center; padding: 24px; }
  #overlay.hide { display: none; }
  #overlay h1 { margin: 0; font-size: clamp(26px, 6vw, 52px); letter-spacing: .08em; }
  #overlay p { margin: 0; color: var(--dim); max-width: 560px; line-height: 1.5; font-size: clamp(14px, 3.6vw, 17px); }
  #overlay .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  #overlay button { font-size: clamp(17px, 4.5vw, 20px); padding: 16px 28px; }

  /* Tablets & small laptops */
  @media (max-width: 820px) {
    :root { --ctrl-fs: 15px; --ctrl-pad: 10px 13px; --gap: 8px; }
  }
  /* Phones: tuck the selects/volume behind a ⚙ toggle to keep the gauge big */
  @media (max-width: 560px) {
    :root { --ctrl-fs: 14px; --ctrl-pad: 10px 12px; --gap: 7px; }
    .brand span { display: none; }
    #gearBtn { display: inline-block; }
    .controls { order: 10; flex-basis: 100%; display: none; padding-top: 2px; }
    .controls.open { display: flex; }
    .controls select, .controls label.vol { flex: 1 1 auto; }
    .controls select { min-width: 0; }
    input[type=range] { max-width: none; flex: 1; }
    #pedals button { min-width: 0; flex: 1; padding: 15px 10px; }
  }
  /* Short landscape (phone on a cradle, compact car screens): keep the header to one row */
  @media (max-height: 480px) and (orientation: landscape) {
    :root { --ctrl-fs: 13px; --ctrl-pad: 8px 11px; --gap: 7px; }
    header, footer { padding-top: calc(5px + var(--sat)); padding-bottom: 5px; flex-wrap: nowrap; }
    footer { padding-bottom: calc(5px + var(--sab)); }
    #gearBtn { display: inline-block; }
    .controls { position: absolute; top: calc(100% + 1px); right: 8px; z-index: 3; display: none;
      flex-direction: column; align-items: stretch; background: var(--panel); border: 1px solid var(--line);
      border-radius: 12px; padding: 10px; width: min(300px, 70vw); box-shadow: 0 10px 30px rgba(0,0,0,.5); }
    .controls.open { display: flex; }
    header { position: relative; }
    #pedals button { padding: 9px 14px; min-width: 96px; }
    .brand { font-size: 13px; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><b>///</b> <span>SPORT ENGINE</span></div>
    <div class="controls" id="controls">
      <select id="engineSel" aria-label="Двигатель">
        <option value="v8">V8 Muscle</option>
        <option value="v10">V10 Supercar</option>
        <option value="i6">I6 Turbo</option>
      </select>
      <label class="vol">🔊 <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8"></label>
      <select id="popSel" aria-label="Попкорн">
        <option value="2">Попкорн: агрессивный</option>
        <option value="1">Попкорн: мягкий</option>
        <option value="0">Попкорн: выкл</option>
      </select>
    </div>
    <div class="actions">
      <button id="popBtn">💥 Выстрел</button>
      <button id="modeBtn">Режим: GPS</button>
      <button id="muteBtn">Звук вкл</button>
      <button id="gearBtn" class="icon" aria-label="Настройки">⚙</button>
      <button id="fsBtn" class="icon" aria-label="Полный экран">⛶</button>
    </div>
  </header>

  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="overlay">
      <h1>SPORT ENGINE</h1>
      <p>Звук мотора и спортивная приборка по скорости автомобиля (GPS).<br>
        Нажмите «Старт» и разрешите доступ к геолокации. Для проверки без поездки — «Демо».</p>
      <div class="row">
        <button class="primary" id="startGps">Старт (GPS)</button>
        <button id="startDemo">Демо</button>
      </div>
    </div>
  </div>

  <footer>
    <div class="status" id="status"><span class="dot" id="dot"></span><span id="statusText">Ожидание</span></div>
    <div id="pedals">
      <button id="brake">ТОРМОЗ</button>
      <button id="gas">ГАЗ</button>
    </div>
  </footer>
</div>

<script>
(() => {
  'use strict';

  // ---------- Engine presets ----------
  // pulses: firings per crankshaft revolution (cylinders / 2)
  const ENGINES = {
    v8:  { pulses: 4, idle: 800,  redline: 7000, limiter: 7200, burble: 0.35, drive: 3.2, bright: 1.0, turbo: 0 },
    v10: { pulses: 5, idle: 1000, redline: 8500, limiter: 8700, burble: 0.12, drive: 2.4, bright: 1.6, turbo: 0 },
    i6:  { pulses: 3, idle: 750,  redline: 7000, limiter: 7200, burble: 0.08, drive: 2.0, bright: 1.2, turbo: 1 },
  };
  // km/h per 1000 rpm in each gear
  const GEARS = [8.5, 14.5, 20.5, 27, 34, 42];
  // pops & bangs tune: dur = volley length (ms), gap = spacing between pops (s), big = chance of a loud bang
  const POPCORN = [
    null,
    { dur: 1000, gap: 0.22, big: 0.03, gain: 0.7 },
    { dur: 2400, gap: 0.10, big: 0.14, gain: 1.0 },
  ];

  const $ = id => document.getElementById(id);
  const cv = $('cv'), g = cv.getContext('2d');

  const state = {
    engine: ENGINES.v8, mode: 'gps', running: false, muted: false,
    speed: 0,          // km/h shown & used by sim
    targetSpeed: 0,    // last GPS speed
    accel: 0,          // km/h per second (smoothed)
    throttle: 0,       // 0..1 estimated or from pedal
    rpm: 0, gear: 0,   // gear 0 = N
    shiftUntil: 0, lastShift: 0,
    gas: false, brake: false,
    lastFix: null, fixTime: 0, gpsAcc: null,
    overrunUntil: 0, overrunDur: 1, overrunManual: false, nextPop: 0, crankUntil: 0,
    popLevel: 2, prevRawAccel: 0,
  };
  const fx = []; // visual flames {t, s, big}

  // ---------- Audio ----------
  let ac, master, popNoise, oscs = [], shaper, lp, engGain, amLfo, amDepth, noiseG, noiseBp, turboOsc, turboG;

  function makeCurve(k) {
    const n = 1024, c = new Float32Array(n);
    for (let i = 0; i < n; i++) { const x = i / (n - 1) * 2 - 1; c[i] = Math.tanh(k * x) / Math.tanh(k); }
    return c;
  }
  function noiseBuffer(sec) {
    const b = ac.createBuffer(1, ac.sampleRate * sec, ac.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return b;
  }

  function initAudio() {
    if (ac) return;
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = +$('vol').value;
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 4;
    master.connect(comp).connect(ac.destination);
    popNoise = noiseBuffer(1);

    const sum = ac.createGain();
    // fundamental firing, sub-harmonic (burble), 2nd harmonic
    [['sawtooth', 0.55], ['square', 0.3], ['sawtooth', 0.18], ['triangle', 0.35]].forEach(([type, gv]) => {
      const o = ac.createOscillator(); o.type = type;
      const gg = ac.createGain(); gg.gain.value = gv;
      o.connect(gg).connect(sum); o.start(); oscs.push({ o, gg, base: gv });
    });
    shaper = ac.createWaveShaper(); shaper.oversample = '2x';
    lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 1.2;
    engGain = ac.createGain(); engGain.gain.value = 0;
    sum.connect(shaper).connect(lp).connect(engGain).connect(master);

    // uneven-firing amplitude wobble
    amLfo = ac.createOscillator(); amLfo.type = 'sine';
    amDepth = ac.createGain(); amDepth.gain.value = 0;
    amLfo.connect(amDepth).connect(engGain.gain); amLfo.start();

    // exhaust / intake roar
    const ns = ac.createBufferSource(); ns.buffer = noiseBuffer(2); ns.loop = true;
    noiseBp = ac.createBiquadFilter(); noiseBp.type = 'bandpass'; noiseBp.Q.value = 0.9;
    noiseG = ac.createGain(); noiseG.gain.value = 0;
    ns.connect(noiseBp).connect(noiseG).connect(master); ns.start();

    // turbo whistle
    turboOsc = ac.createOscillator(); turboOsc.type = 'sine';
    turboG = ac.createGain(); turboG.gain.value = 0;
    turboOsc.connect(turboG).connect(master); turboOsc.start();

    applyEngine();
  }

  function applyEngine() {
    if (!ac) return;
    shaper.curve = makeCurve(state.engine.drive);
  }

  function setP(p, v, tc = 0.03) { p.setTargetAtTime(v, ac.currentTime, tc); }

  function updateAudio() {
    if (!ac) return;
    const E = state.engine, rpm = Math.max(state.rpm, 1);
    const f = rpm / 60 * E.pulses;
    const t = state.throttle;
    const shifting = performance.now() < state.shiftUntil;

    setP(oscs[0].o.frequency, f);
    setP(oscs[1].o.frequency, f / 2);
    setP(oscs[2].o.frequency, f * 2);
    setP(oscs[3].o.frequency, f / 4);
    setP(oscs[1].gg.gain, oscs[1].base * (0.4 + E.burble * 2) * (1 - rpm / E.limiter * 0.7));
    setP(oscs[3].gg.gain, oscs[3].base * (1.2 - rpm / E.limiter));

    const load = 0.35 + 0.65 * t;
    setP(lp.frequency, (300 + rpm * 0.35 * E.bright) * (0.6 + 0.8 * t));
    const vol = state.muted ? 0 : (shifting ? 0.12 : 0.28 + 0.42 * load);
    setP(engGain.gain, vol, shifting ? 0.01 : 0.04);
    setP(amLfo.frequency, f / 4);
    setP(amDepth.gain, state.muted ? 0 : vol * E.burble * (1.3 - rpm / E.limiter));

    setP(noiseBp.frequency, 200 + rpm * 0.25);
    setP(noiseG.gain, state.muted ? 0 : (0.02 + 0.16 * t) * (rpm / E.limiter + 0.2));

    if (E.turbo) {
      setP(turboOsc.frequency, 1800 + rpm * 0.9);
      setP(turboG.gain, state.muted ? 0 : 0.018 * t * Math.min(1, rpm / 3500), 0.25);
    } else setP(turboG.gain, 0);
  }

  // exhaust crackle / backfire
  // one exhaust pop scheduled at audio time `when`; big = loud backfire bang
  function popAt(when, strength = 1, big = false) {
    if (!ac || state.muted) return;
    const len = big ? 0.22 : 0.03 + Math.random() * 0.05;

    // crack: short burst of filtered noise
    const src = ac.createBufferSource(); src.buffer = popNoise;
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass';
    bp.frequency.value = big ? 350 + Math.random() * 400 : 700 + Math.random() * 1900;
    bp.Q.value = big ? 0.7 : 1.6;
    const gg = ac.createGain();
    gg.gain.setValueAtTime(0, when);
    gg.gain.linearRampToValueAtTime((big ? 1.6 : 0.9) * strength, when + 0.003);
    gg.gain.exponentialRampToValueAtTime(0.001, when + len);
    src.connect(bp).connect(gg).connect(master);
    src.start(when, Math.random() * 0.6); src.stop(when + len + 0.02);

    // thump: pitch-dropping low sine
    const th = ac.createOscillator(); th.type = 'sine';
    th.frequency.setValueAtTime(big ? 150 : 110, when);
    th.frequency.exponentialRampToValueAtTime(40, when + (big ? 0.2 : 0.08));
    const tg = ac.createGain();
    tg.gain.setValueAtTime((big ? 1.3 : 0.6) * strength, when);
    tg.gain.exponentialRampToValueAtTime(0.001, when + (big ? 0.25 : 0.1));
    th.connect(tg).connect(master); th.start(when); th.stop(when + 0.3);

    const delay = Math.max(0, (when - ac.currentTime) * 1000);
    setTimeout(() => fx.push({ t: performance.now(), s: strength, big }), delay);
  }
  function pop(strength = 1) { if (ac) popAt(ac.currentTime, strength, false); }

  // start a "popcorn" volley (throttle lift-off on overrun)
  function triggerOverrun(manual = false) {
    const P = POPCORN[state.popLevel];
    if (!P || !ac) return;
    const now = performance.now();
    if (!manual && now < state.overrunUntil) return;
    state.overrunDur = P.dur * (0.7 + Math.random() * 0.6);
    state.overrunUntil = now + state.overrunDur;
    state.overrunManual = manual;
    state.nextPop = ac.currentTime + 0.06;
    blowOff();
  }

  function blowOff() {
    if (!ac || state.muted || !state.engine.turbo) return;
    const now = ac.currentTime;
    const src = ac.createBufferSource(); src.buffer = noiseBuffer(0.5);
    const hp = ac.createBiquadFilter(); hp.type = 'bandpass'; hp.Q.value = 2;
    hp.frequency.setValueAtTime(3500, now); hp.frequency.exponentialRampToValueAtTime(900, now + 0.4);
    const gg = ac.createGain();
    gg.gain.setValueAtTime(0.25, now); gg.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
    src.connect(hp).connect(gg).connect(master); src.start(now); src.stop(now + 0.5);
  }

  // ---------- GPS ----------
  let watchId = null;
  function haversine(a, b) {
    const R = 6371000, toR = Math.PI / 180;
    const dLat = (b.latitude - a.latitude) * toR, dLon = (b.longitude - a.longitude) * toR;
    const s = Math.sin(dLat / 2) ** 2 + Math.cos(a.latitude * toR) * Math.cos(b.latitude * toR) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(s));
  }

  function startGps() {
    if (!('geolocation' in navigator)) { setStatus('Геолокация недоступна в этом браузере', 'warn'); return; }
    setStatus('Ищу GPS…', 'warn');
    watchId = navigator.geolocation.watchPosition(onFix, err => {
      setStatus('GPS: ' + (err.code === 1 ? 'доступ запрещён' : err.message), 'warn');
    }, { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 });
  }
  function stopGps() { if (watchId !== null) navigator.geolocation.clearWatch(watchId); watchId = null; }

  function onFix(pos) {
    const c = pos.coords, now = performance.now();
    let kmh = null;
    if (c.speed !== null && !isNaN(c.speed)) kmh = c.speed * 3.6;
    else if (state.lastFix) {
      const dt = (pos.timestamp - state.lastFix.timestamp) / 1000;
      if (dt > 0.05) kmh = haversine(state.lastFix.coords, c) / dt * 3.6;
    }
    state.gpsAcc = c.accuracy;
    if (kmh !== null && kmh < 400) {
      if (kmh < 1.5) kmh = 0;
      const dt = state.fixTime ? (now - state.fixTime) / 1000 : 0;
      if (dt > 0.05 && dt < 5) {
        const a = (kmh - state.targetSpeed) / dt;
        state.accel += (a - state.accel) * Math.min(1, dt * 1.5);
        // Tesla lift-off = instant regen braking: speed starts dropping right after holding/gaining.
        // That transition is our "foot off the pedal" signal for the popcorn volley.
        if (a < -2 && state.prevRawAccel > -0.8 && kmh > 20) triggerOverrun();
        state.prevRawAccel = a;
      }
      state.targetSpeed = kmh;
      state.fixTime = now;
    }
    state.lastFix = pos;
    setStatus(`GPS ±${Math.round(c.accuracy)} м · ${kmh === null ? '—' : Math.round(kmh) + ' км/ч'}`, c.accuracy < 30 ? 'ok' : 'warn');
  }

  function setStatus(text, kind) {
    $('statusText').textContent = text;
    $('dot').className = 'dot ' + (kind || '');
  }

  // ---------- Simulation ----------
  let last = performance.now();
  function step(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    const E = state.engine;

    if (state.mode === 'demo') {
      const top = 280;
      let a = state.gas ? 22 * (1 - state.speed / top) * (state.gear <= 1 ? 1 : 1.3 / Math.sqrt(state.gear)) : -1.8 - state.speed * 0.012;
      if (state.brake) a = -35;
      if (now < state.shiftUntil) a = Math.min(a, 0);
      state.speed = Math.max(0, state.speed + a * dt);
      state.accel += (a - state.accel) * Math.min(1, dt * 6);
      state.throttle += ((state.gas ? 1 : 0) - state.throttle) * Math.min(1, dt * 10);
    } else {
      // extrapolate between ~1 Hz GPS fixes so the needle moves smoothly
      const since = (now - state.fixTime) / 1000;
      const predicted = state.fixTime ? Math.max(0, state.targetSpeed + state.accel * Math.min(since, 1.2)) : 0;
      state.speed += (predicted - state.speed) * Math.min(1, dt * 4);
      // Model 3: ~20 km/h/s at full power. Treat ~9 km/h/s as full throttle.
      const tt = Math.max(0, Math.min(1, state.accel / 9));
      state.throttle += (tt - state.throttle) * Math.min(1, dt * 3);
      if (since > 4) state.accel *= 0.9; // stale GPS
    }

    // gearbox
    const v = state.speed;
    if (v < 2 && state.throttle < 0.1) state.gear = 0;
    else if (state.gear === 0) state.gear = 1;
    if (state.gear > 0 && now > state.shiftUntil + 250) {
      const rpmIn = gr => E.idle * 0.6 + v / GEARS[gr - 1] * 1000;
      const upAt = 3000 + state.throttle * (E.redline - 3300);
      const holdGear = now < state.overrunUntil && rpmIn(state.gear) < E.redline; // keep rpm up while crackling
      if (state.gear < GEARS.length && rpmIn(state.gear) > upAt && !holdGear) {
        state.gear++; state.shiftUntil = now + 110;
        if (state.throttle > 0.6 && state.popLevel) setTimeout(() => popAt(ac.currentTime, 0.9, state.popLevel === 2), 30);
        if (state.throttle > 0.3) blowOff();
      } else if (state.gear > 1 && rpmIn(state.gear) < 1500) {
        state.gear--; state.shiftUntil = now + 90; // rev-matched downshift
        if (Math.random() < 0.7) setTimeout(() => pop(0.6), 60);
      } else if (state.gear > 1 && state.throttle > 0.85 && rpmIn(state.gear - 1) < E.redline * 0.85 && rpmIn(state.gear) < 3500) {
        state.gear--; state.shiftUntil = now + 90; // kickdown
      }
    }

    let targetRpm;
    if (state.gear === 0) targetRpm = E.idle + (state.mode === 'demo' && state.gas ? (E.redline - E.idle) * 0.9 : 0);
    else targetRpm = Math.max(E.idle, E.idle * 0.6 + v / GEARS[state.gear - 1] * 1000);
    if (now < state.crankUntil) targetRpm = E.idle * 1.9;
    if (state.overrunManual && now < state.overrunUntil) {
      // parked show: rev up, then let it crackle while rpm falls
      const left = (state.overrunUntil - now) / state.overrunDur;
      targetRpm = Math.max(targetRpm, E.idle + (E.redline * 0.6 - E.idle) * left);
    }
    targetRpm += Math.sin(now / 90) * 12 + (Math.random() - 0.5) * 20;
    if (targetRpm > E.limiter) targetRpm = E.limiter - (Math.floor(now / 70) % 2) * 400; // limiter bounce
    const rate = now < state.shiftUntil ? 14 : (targetRpm > state.rpm ? 7 : 5);
    state.rpm += (targetRpm - state.rpm) * Math.min(1, dt * rate);

    // demo: releasing the gas pedal at high rpm starts the popcorn
    if (state.mode === 'demo' && state._pt > 0.4 && state.throttle <= 0.4 && state.rpm > 2500) triggerOverrun();
    state._pt = state.throttle;

    // popcorn volley: schedule pops slightly ahead on the audio clock (tight, irregular rhythm)
    const P = POPCORN[state.popLevel];
    const overrun = P && ac && now < state.overrunUntil &&
      (state.overrunManual || (state.throttle < 0.3 && state.rpm > 1800));
    if (overrun) {
      const left = (state.overrunUntil - now) / state.overrunDur; // 1 → 0
      while (state.nextPop < ac.currentTime + 0.06) {
        const t = Math.max(state.nextPop, ac.currentTime + 0.005);
        const big = Math.random() < P.big * (0.4 + left);
        popAt(t, (0.35 + Math.random() * 0.65) * (0.4 + 0.6 * left) * P.gain, big);
        const cluster = Math.random() < 0.35; // quick double/triple "pa-pa-pap"
        state.nextPop = t + (cluster ? 0.018 + Math.random() * 0.03 : 0.05 + Math.random() * P.gap) / (0.45 + left * 0.8);
      }
    } else if (state.overrunUntil && now >= state.overrunUntil) {
      state.overrunUntil = 0; state.overrunManual = false;
    }

    updateAudio();
    draw(now);
    requestAnimationFrame(step);
  }

  // ---------- Drawing ----------
  let W = 0, H = 0, dpr = 1;
  function resize() {
    dpr = Math.min(2.5, window.devicePixelRatio || 1);
    const r = cv.getBoundingClientRect(); W = Math.max(1, r.width); H = Math.max(1, r.height);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  }
  window.addEventListener('resize', resize);
  // orientation flips and mobile URL-bar show/hide change the box after a tick
  window.addEventListener('orientationchange', () => { resize(); setTimeout(resize, 300); });

  const START = Math.PI * 0.75, SWEEP = Math.PI * 1.5;

  function draw(now) {
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, W, H);
    while (fx.length && now - fx[0].t > 450) fx.shift();
    const bang = fx.reduce((m, f) => f.big ? Math.max(m, 1 - (now - f.t) / 180) : m, 0);
    if (bang > 0) g.translate((Math.random() - 0.5) * 14 * bang, (Math.random() - 0.5) * 14 * bang);
    const E = state.engine;
    const maxRpm = Math.ceil(E.limiter / 1000) * 1000 + 1000;

    // --- responsive layout: size the gauge to the available box in any aspect ---
    const n = 15, lw = Math.max(8, Math.min(26, W * 0.03)), gap = lw * 0.45;
    const bw = Math.max(9, Math.min(20, Math.min(W, H) * 0.05));   // side-bar width
    const topReserve = lw * 2.1 + 6;                               // room for shift lights
    const Rw = (W / 2 - 14 - bw) / 1.04;                           // don't collide with side bars
    const Rh = (H - 10 - topReserve) / 1.99;                       // gauge + gear digit below
    const R = Math.max(52, Math.min(Rw, Rh));
    const used = topReserve + R * 1.99 + 10;
    const yOff = Math.max(0, (H - used) / 2);
    const cx = W / 2, cy = yOff + topReserve + R * 1.04;

    // shift lights
    const upAt = 3000 + state.throttle * (E.redline - 3300);
    const total = n * lw + (n - 1) * gap, x0 = cx - total / 2, ly = cy - R * 1.04 - lw * 1.05;
    const frac = Math.max(0, Math.min(1, (state.rpm - (upAt - 2200)) / 2200));
    const blink = state.rpm > E.redline && Math.floor(now / 80) % 2;
    for (let i = 0; i < n; i++) {
      const lit = !blink && i < Math.round(frac * n);
      const col = i < 5 ? '#31d158' : i < 10 ? '#ffb020' : '#ff3b30';
      g.beginPath(); g.arc(x0 + i * (lw + gap) + lw / 2, ly, lw / 2, 0, Math.PI * 2);
      g.fillStyle = lit ? col : '#1a1d23';
      if (lit) { g.shadowColor = col; g.shadowBlur = 14; }
      g.fill(); g.shadowBlur = 0;
    }

    // dial face
    const grad = g.createRadialGradient(cx, cy, R * 0.1, cx, cy, R * 1.05);
    grad.addColorStop(0, '#15181e'); grad.addColorStop(1, '#0a0b0e');
    g.beginPath(); g.arc(cx, cy, R * 1.04, 0, Math.PI * 2); g.fillStyle = grad; g.fill();
    g.lineWidth = 2; g.strokeStyle = '#2a2f38'; g.stroke();

    const ang = r => START + SWEEP * Math.min(1, r / maxRpm);

    // redline band
    g.beginPath(); g.arc(cx, cy, R * 0.93, ang(E.redline), ang(maxRpm));
    g.lineWidth = R * 0.06; g.strokeStyle = '#b3160d'; g.stroke();

    // rpm arc fill
    g.beginPath(); g.arc(cx, cy, R * 0.98, START, ang(state.rpm));
    g.lineWidth = R * 0.025;
    g.strokeStyle = state.rpm > E.redline ? '#ff3b30' : '#ffffff';
    g.shadowColor = g.strokeStyle; g.shadowBlur = 12; g.stroke(); g.shadowBlur = 0;

    // ticks & numbers
    g.textAlign = 'center'; g.textBaseline = 'middle';
    for (let r = 0; r <= maxRpm; r += 250) {
      const a = ang(r), major = r % 1000 === 0, half = r % 500 === 0;
      const r1 = R * (major ? 0.8 : half ? 0.85 : 0.88), r2 = R * 0.91;
      g.beginPath();
      g.moveTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
      g.lineTo(cx + Math.cos(a) * r2, cy + Math.sin(a) * r2);
      g.lineWidth = major ? 4 : 2; g.strokeStyle = r >= E.redline ? '#ff3b30' : (major ? '#e9edf2' : '#5b6370'); g.stroke();
      if (major) {
        g.font = `700 ${R * 0.11}px -apple-system, Roboto, sans-serif`;
        g.fillStyle = r >= E.redline ? '#ff3b30' : '#e9edf2';
        g.fillText(r / 1000, cx + Math.cos(a) * R * 0.68, cy + Math.sin(a) * R * 0.68);
      }
    }
    g.font = `600 ${R * 0.05}px -apple-system, Roboto, sans-serif`; g.fillStyle = '#7c8594';
    g.fillText('×1000 r/min', cx, cy + R * 0.62);

    // needle
    const na = ang(state.rpm);
    g.save(); g.translate(cx, cy); g.rotate(na);
    g.beginPath(); g.moveTo(-R * 0.12, -4); g.lineTo(R * 0.9, -1.5); g.lineTo(R * 0.9, 1.5); g.lineTo(-R * 0.12, 4); g.closePath();
    g.fillStyle = '#ff3b30'; g.shadowColor = '#ff3b30'; g.shadowBlur = 18; g.fill(); g.restore();
    g.shadowBlur = 0;
    g.beginPath(); g.arc(cx, cy, R * 0.26, 0, Math.PI * 2); g.fillStyle = '#0c0d10'; g.fill();
    g.lineWidth = 2; g.strokeStyle = '#2a2f38'; g.stroke();

    // speed + gear
    g.fillStyle = '#ffffff';
    g.font = `800 ${R * 0.24}px -apple-system, Roboto, sans-serif`;
    g.fillText(Math.round(state.speed), cx, cy - R * 0.02);
    g.font = `600 ${R * 0.06}px -apple-system, Roboto, sans-serif`; g.fillStyle = '#7c8594';
    g.fillText('км/ч', cx, cy + R * 0.16);

    g.font = `800 ${R * 0.2}px -apple-system, Roboto, sans-serif`;
    g.fillStyle = state.gear === 0 ? '#31d158' : '#ffb020';
    g.fillText(state.gear === 0 ? 'N' : state.gear, cx, cy + R * 0.8);

    // side bars: throttle (left), g-force (right) — flush to the screen edges
    const bh = Math.min(R * 1.25, H - yOff - topReserve - 24), by = cy - bh / 2;
    const bx1 = 12, bx2 = W - 12 - bw;
    bar(bx1, by, bw, bh, state.throttle, '#31d158', 'ГАЗ');
    const gForce = state.accel / 3.6 / 9.81;
    bar(bx2, by, bw, bh, Math.min(1, Math.abs(gForce) / 0.8), gForce < 0 ? '#ff3b30' : '#ffb020', (Math.abs(gForce)).toFixed(2) + 'g');

    drawFlames(now, bang);
  }

  // exhaust flames from two "tailpipes" at the bottom edge
  function drawFlames(now, bang) {
    g.save();
    g.globalCompositeOperation = 'lighter';
    const pipes = [W * 0.3, W * 0.7];
    for (const f of fx) {
      const age = (now - f.t) / (f.big ? 300 : 160);
      if (age >= 1) continue;
      const a = (1 - age) * Math.min(1, f.s);
      const len = (f.big ? 0.42 : 0.2 + f.s * 0.12) * H * (0.6 + age * 0.6);
      for (const px of pipes) {
        const jitter = (Math.random() - 0.5) * len * 0.25;
        const gr = g.createRadialGradient(px + jitter, H, 0, px + jitter, H, len);
        gr.addColorStop(0, `rgba(160,200,255,${a})`);
        gr.addColorStop(0.18, `rgba(255,220,120,${a})`);
        gr.addColorStop(0.5, `rgba(255,110,20,${a * 0.75})`);
        gr.addColorStop(1, 'rgba(255,40,0,0)');
        g.fillStyle = gr;
        g.beginPath(); g.ellipse(px + jitter, H, len * 0.45, len, 0, Math.PI, 0); g.fill();
      }
    }
    g.restore();
    if (bang > 0) { g.fillStyle = `rgba(255,120,30,${0.22 * bang})`; g.fillRect(-20, -20, W + 40, H + 40); }
  }

  function bar(x, y, w, h, v, col, label) {
    g.fillStyle = '#15181e'; roundRect(x, y, w, h, w / 2); g.fill();
    const fh = h * v;
    g.fillStyle = col; roundRect(x, y + h - fh, w, fh, w / 2); g.fill();
    g.font = `600 ${Math.max(10, Math.min(14, w * 0.8))}px -apple-system, Roboto, sans-serif`;
    g.fillStyle = '#7c8594'; g.textAlign = 'center';
    g.fillText(label, x + w / 2, Math.min(H - 5, y + h + 16));
  }
  function roundRect(x, y, w, h, r) {
    r = Math.min(r, h / 2, w / 2); g.beginPath();
    g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  }

  // ---------- Controls ----------
  let wakeLock = null;
  async function keepAwake() {
    try { wakeLock = await navigator.wakeLock?.request('screen'); } catch (e) { /* not supported */ }
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && state.running) keepAwake(); });

  function setMode(mode) {
    state.mode = mode;
    $('modeBtn').textContent = 'Режим: ' + (mode === 'gps' ? 'GPS' : 'Демо');
    $('pedals').classList.toggle('show', mode === 'demo');
    if (mode === 'gps') { startGps(); }
    else { stopGps(); setStatus('Демо: держите «ГАЗ» (или ↑ / пробел)', 'ok'); }
  }

  function start(mode) {
    initAudio(); ac.resume();
    $('overlay').classList.add('hide');
    state.running = true;
    state.crankUntil = performance.now() + 700;
    setTimeout(() => pop(0.5), 650);
    keepAwake();
    setMode(mode);
  }

  $('startGps').onclick = () => start('gps');
  $('startDemo').onclick = () => start('demo');
  $('popSel').onchange = e => { state.popLevel = +e.target.value; if (!state.popLevel) state.overrunUntil = 0; };
  $('popBtn').onclick = () => { if (state.running && state.popLevel) triggerOverrun(true); };
  $('modeBtn').onclick = () => { if (!state.running) return; setMode(state.mode === 'gps' ? 'demo' : 'gps'); };
  $('muteBtn').onclick = () => { state.muted = !state.muted; $('muteBtn').textContent = state.muted ? 'Звук выкл' : 'Звук вкл'; $('muteBtn').classList.toggle('on', state.muted); };
  $('vol').oninput = e => { if (master) master.gain.value = +e.target.value; };
  $('engineSel').onchange = e => { state.engine = ENGINES[e.target.value]; applyEngine(); state.crankUntil = performance.now() + 500; };
  $('gearBtn').onclick = () => { const c = $('controls').classList.toggle('open'); $('gearBtn').classList.toggle('on', c); setTimeout(resize, 0); };
  // auto-close the settings drawer after picking an option on phones
  ['engineSel', 'popSel'].forEach(id => $(id).addEventListener('change', () => {
    if (window.matchMedia('(max-width: 560px)').matches) { $('controls').classList.remove('open'); $('gearBtn').classList.remove('on'); setTimeout(resize, 0); }
  }));
  $('fsBtn').onclick = () => {
    const el = document.documentElement;
    if (document.fullscreenElement) document.exitFullscreen?.(); else (el.requestFullscreen || el.webkitRequestFullscreen)?.call(el);
    setTimeout(resize, 150);
  };

  function hold(btn, key) {
    const on = e => { e.preventDefault(); state[key] = true; btn.classList.add('down'); };
    const off = () => { state[key] = false; btn.classList.remove('down'); };
    btn.addEventListener('pointerdown', on);
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => btn.addEventListener(t, off));
  }
  hold($('gas'), 'gas'); hold($('brake'), 'brake');
  window.addEventListener('keydown', e => {
    if (state.mode !== 'demo') return;
    if (e.code === 'ArrowUp' || e.code === 'Space') { state.gas = true; e.preventDefault(); }
    if (e.code === 'ArrowDown') state.brake = true;
  });
  window.addEventListener('keyup', e => {
    if (e.code === 'ArrowUp' || e.code === 'Space') state.gas = false;
    if (e.code === 'ArrowDown') state.brake = false;
  });

  resize();
  requestAnimationFrame(step);
})();
</script>
</body>
</html>
