<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07080a">
<title>Sport Engine</title>
<style>
  :root {
    --bg: #07080a; --panel: #111318; --line: #22262e; --text: #e9edf2; --dim: #7c8594;
    --accent: #ff3b30; --amber: #ffb020; --green: #31d158;
    --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
    --ctrl-fs: 16px; --ctrl-pad: 11px 15px; --gap: 10px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow: hidden; user-select: none;
    -webkit-user-select: none; }
  #app { display: grid; grid-template-rows: auto 1fr auto; height: 100%; height: 100dvh; }
  header { display: flex; gap: var(--gap); align-items: center; flex-wrap: wrap;
    padding: 10px calc(14px + var(--sar)) 10px calc(14px + var(--sal)); padding-top: calc(10px + var(--sat));
    border-bottom: 1px solid var(--line); }
  footer { display: flex; gap: var(--gap); align-items: center; justify-content: space-between; flex-wrap: wrap;
    padding: 10px calc(14px + var(--sar)) calc(10px + var(--sab)) calc(14px + var(--sal));
    border-top: 1px solid var(--line); }
  .brand { font-weight: 800; letter-spacing: .16em; font-size: 15px; margin-right: auto; white-space: nowrap; }
  .brand b { color: var(--accent); }
  .controls { display: flex; gap: var(--gap); align-items: center; flex-wrap: wrap; }
  .actions { display: flex; gap: var(--gap); align-items: center; flex-wrap: wrap; }
  button, select { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 12px;
    padding: var(--ctrl-pad); font-size: var(--ctrl-fs); font-weight: 600; cursor: pointer; line-height: 1.1; }
  button.on { border-color: var(--accent); color: #fff; background: #2a0d0b; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.icon { padding: var(--ctrl-pad); }
  #gearBtn { display: none; }
  label.vol { display: flex; align-items: center; gap: 8px; color: var(--dim); font-size: 14px; white-space: nowrap; }
  input[type=range] { width: 120px; max-width: 32vw; accent-color: var(--accent); }
  /* track mode */
  #trackView { position: absolute; inset: 0; z-index: 1; background: var(--bg); display: flex; flex-direction: column; gap: 10px;
    padding: 12px calc(14px + var(--sar)) 10px calc(14px + var(--sal)); }
  #trackView[hidden] { display: none; }
  .tstats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
  .tcard { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; display: flex; flex-direction: column; min-width: 0; }
  .tcard span { color: var(--dim); font-size: 12px; }
  .tcard b { font-size: 21px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tcard small { color: var(--dim); font-size: 11.5px; line-height: 1.3; }
  .tcard.hl { border-color: var(--green); box-shadow: 0 0 0 1px var(--green) inset; }
  .tmap { flex: 1; min-height: 120px; background: #0c0d10; border: 1px solid var(--line); border-radius: 12px; position: relative; overflow: hidden; }
  .tmap canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .tbar { display: flex; gap: 8px; flex-wrap: wrap; }
  #recBtn.on { background: #2a0d0b; border-color: var(--accent); }
  .tsensors { color: var(--dim); font-size: 12px; }
  .hlist { max-height: 60vh; overflow-y: auto; padding: 6px 12px; }
  .hrow { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .hrow small { display: block; color: var(--dim); font-size: 12px; margin-top: 2px; }
  .hact { display: flex; gap: 6px; flex-shrink: 0; }
  .hact button { padding: 8px 10px; font-size: 13px; }
  .hempty { color: var(--dim); text-align: center; padding: 30px 0; }
  @media (max-width: 560px) { .tstats { grid-template-columns: 1fr 1fr; } .tcard b { font-size: 18px; } .tbar button { flex: 1 1 auto; } }
  /* car picker button + wheel sheet */
  .carbtn { display: inline-flex; align-items: center; gap: 6px; max-width: 46vw; }
  .carbtn #carName { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .carbtn .chev { color: var(--dim); font-size: .85em; }
  .tesla-start { max-width: 92vw; }
  .sheet { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.55); display: flex; align-items: flex-end; justify-content: center; }
  .sheet[hidden] { display: none; }
  .sheet-card { width: min(560px, 100%); background: #14161b; border: 1px solid var(--line); border-bottom: 0;
    border-radius: 18px 18px 0 0; padding-bottom: calc(10px + var(--sab)); animation: up .22s ease-out; }
  @keyframes up { from { transform: translateY(40px); opacity: .4 } to { transform: none; opacity: 1 } }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid var(--line); font-weight: 700; }
  button.link { background: none; border: 0; color: var(--dim); padding: 10px 12px; }
  button.link.strong { color: var(--accent); }
  .wheel-wrap { position: relative; height: 290px; }
  .wheel { position: absolute; inset: 0; overflow-y: auto; scroll-snap-type: y mandatory; padding: 116px 0;
    scrollbar-width: none; perspective: 700px; -webkit-mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent);
    mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent); }
  .wheel::-webkit-scrollbar { display: none; }
  .wi { height: 58px; scroll-snap-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; transform-origin: center; transition: color .15s; color: var(--dim); }
  .wi b { font-size: 19px; color: inherit; font-weight: 700; }
  .wi small { font-size: 12px; opacity: .8; margin-top: 2px; }
  .wi.cur { color: #fff; }
  .wheel-band { position: absolute; left: 12px; right: 12px; top: 116px; height: 58px; border-radius: 12px;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.08); pointer-events: none; }
  /* engine switch (segmented) */
  .seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; background: transparent; color: var(--dim);
    padding: var(--ctrl-pad); font-size: var(--ctrl-fs); white-space: nowrap; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.active { background: var(--accent); color: #fff; }
  #stage { position: relative; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .status { color: var(--dim); font-size: 13px; font-variant-numeric: tabular-nums; }
  .status .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--dim); margin-right: 6px; vertical-align: 1px; }
  .status .dot.ok { background: var(--green); } .status .dot.warn { background: var(--amber); }
  #pedals { display: none; gap: var(--gap); }
  #pedals.show { display: flex; flex: 1; justify-content: flex-end; }
  #pedals button { min-width: 110px; padding: 16px; font-size: 17px; touch-action: none; }
  #gas.down { background: var(--green); color: #000; }
  #brake.down { background: var(--accent); }
  #overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; background: rgba(7,8,10,.88); z-index: 2; text-align: center; padding: 24px; }
  #overlay.hide { display: none; }
  #overlay h1 { margin: 0; font-size: clamp(26px, 6vw, 52px); letter-spacing: .08em; }
  #overlay p { margin: 0; color: var(--dim); max-width: 560px; line-height: 1.5; font-size: clamp(14px, 3.6vw, 17px); }
  #overlay .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  #overlay button { font-size: clamp(17px, 4.5vw, 20px); padding: 16px 28px; }

  /* Tablets & small laptops */
  @media (max-width: 820px) {
    :root { --ctrl-fs: 15px; --ctrl-pad: 10px 13px; --gap: 8px; }
  }
  /* Phones: tuck the selects/volume behind a ⚙ toggle to keep the gauge big */
  @media (max-width: 560px) {
    :root { --ctrl-fs: 14px; --ctrl-pad: 10px 12px; --gap: 7px; }
    .brand span { display: none; }
    #gearBtn { display: inline-block; }
    .controls { order: 10; flex-basis: 100%; display: none; padding-top: 2px; }
    .controls.open { display: flex; }
    .controls select, .controls label.vol { flex: 1 1 auto; }
    .controls select { min-width: 0; }
    .controls .seg { flex-basis: 100%; }
    .controls .seg button { flex: 1; }
    input[type=range] { max-width: none; flex: 1; }
    #pedals button { min-width: 0; flex: 1; padding: 15px 10px; }
  }
  /* Short landscape (phone on a cradle, compact car screens): keep the header to one row */
  @media (max-height: 480px) and (orientation: landscape) {
    :root { --ctrl-fs: 13px; --ctrl-pad: 8px 11px; --gap: 7px; }
    header, footer { padding-top: calc(5px + var(--sat)); padding-bottom: 5px; flex-wrap: nowrap; }
    footer { padding-bottom: calc(5px + var(--sab)); }
    #gearBtn { display: inline-block; }
    .controls { position: absolute; top: calc(100% + 1px); right: 8px; z-index: 3; display: none;
      flex-direction: column; align-items: stretch; background: var(--panel); border: 1px solid var(--line);
      border-radius: 12px; padding: 10px; width: min(300px, 70vw); box-shadow: 0 10px 30px rgba(0,0,0,.5); }
    .controls.open { display: flex; }
    header { position: relative; }
    #pedals button { padding: 9px 14px; min-width: 96px; }
    .brand { font-size: 13px; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><b>///</b> <span>SPORT ENGINE</span></div>
    <div class="controls" id="controls">
      <button id="teslaBtn" class="carbtn" title="Ваша Tesla">⚡ <span id="teslaName">Tesla</span> <span class="chev">▾</span></button>
      <label class="vol">🔊 <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8"></label>
      <select id="popSel" aria-label="Попкорн">
        <option value="2">Попкорн: агрессивный</option>
        <option value="1">Попкорн: мягкий</option>
        <option value="0">Попкорн: выкл</option>
      </select>
      <select id="popSrc" aria-label="Звук хлопков">
        <option value="synth">Хлопки: синтез</option>
        <option value="real">Хлопки: оригинал</option>
        <option value="mix">Хлопки: микс</option>
      </select>
    </div>
    <div class="actions">
      <button id="viewBtn">🏁 Трек</button>
      <button id="carBtn" class="carbtn" aria-haspopup="dialog"><span id="carName">—</span> <span class="chev">▾</span></button>
      <button id="popBtn">💥 Выстрел</button>
      <button id="modeBtn">Режим: GPS</button>
      <button id="muteBtn">Звук вкл</button>
      <button id="gearBtn" class="icon" aria-label="Настройки">⚙</button>
      <button id="fsBtn" class="icon" aria-label="Полный экран">⛶</button>
    </div>
  </header>

  <div id="stage">
    <canvas id="cv"></canvas>
    <section id="trackView" hidden>
      <div id="tStats" class="tstats"></div>
      <div class="tmap"><canvas id="routeCv"></canvas></div>
      <div class="tbar">
        <button id="recBtn" class="primary">● Записать поездку</button>
        <button id="liveBtn">Текущая</button>
        <button id="histBtn">История</button>
        <button id="gpxBtn">GPX</button>
        <button id="resetTimers">Сброс замеров</button>
      </div>
      <div id="tSensors" class="tsensors"></div>
    </section>
    <div id="overlay">
      <h1>SPORT ENGINE</h1>
      <p>Звук мотора и спортивная приборка по скорости автомобиля (GPS).<br>
        Нажмите «Старт» и разрешите доступ к геолокации. Для проверки без поездки — «Демо».</p>
      <button id="teslaBtn2" class="carbtn tesla-start">Моя машина: <b id="teslaName2">Tesla</b> <span class="chev">▾</span></button>
      <div class="row">
        <button class="primary" id="startGps">Старт (GPS)</button>
        <button id="startDemo">Демо</button>
      </div>
    </div>
  </div>

  <footer>
    <div class="status" id="status"><span class="dot" id="dot"></span><span id="statusText">Ожидание</span></div>
    <div id="pedals">
      <button id="brake">ТОРМОЗ</button>
      <button id="gas">ГАЗ</button>
    </div>
  </footer>

  <div id="history" class="sheet" hidden>
    <div class="sheet-card" role="dialog" aria-label="История поездок">
      <div class="sheet-head"><span>История поездок</span><button id="histClose" class="link strong">Готово</button></div>
      <div id="histList" class="hlist"></div>
    </div>
  </div>

  <div id="picker" class="sheet" hidden>
    <div class="sheet-card" role="dialog" aria-label="Выбор машины">
      <div class="sheet-head">
        <button id="pickCancel" class="link">Отмена</button>
        <span id="pickTitle">Машина</span>
        <button id="pickDone" class="link strong">Готово</button>
      </div>
      <div class="wheel-wrap">
        <div class="wheel" id="wheel" tabindex="0"></div>
        <div class="wheel-band" aria-hidden="true"></div>
      </div>
    </div>
  </div>
</div>

<script src="cars.js"></script>
<script src="teslas.js"></script>
<script>
(() => {
  'use strict';

  // ---------- Car catalog: see cars.js (window.CARS) ----------
  const CARS = window.CARS || [];
  const carById = id => CARS.find(c => c.id === id) || CARS[0];
  // ---------- Your Tesla: physics model ----------
  // From mass / power / 0-100 time we solve the launch (traction-limited) acceleration a0,
  // then at any speed the most the car can do is min(a0, P/(m·v)) minus rolling + air drag.
  const G0 = 9.81;
  const TESLAS = window.TESLAS || [];
  function evModel(T) {
    const m = T.mass + 80, Pw = T.kw * 1000 * 0.9;
    const res = v => (0.011 * m * G0 + 0.6 * T.cda * v * v) / m;            // m/s² of drag at v (m/s)
    const sim = a0 => { let v = 0, t = 0; while (v < 27.78 && t < 30) { v += (Math.min(a0, Pw / (m * Math.max(v, 0.5))) - res(v)) * 0.01; t += 0.01; } return t; };
    let lo = 1, hi = 14;
    for (let i = 0; i < 40; i++) { const mid = (lo + hi) / 2; if (sim(mid) > T.t100) lo = mid; else hi = mid; }
    const a0 = Math.min(hi, 1.3 * G0);
    return { T, m, Pw, a0, res, top: T.top / 3.6, regen: 0.19 * G0,
      amax: v => Math.max(0.3, Math.min(a0, Pw / (m * Math.max(v, 0.5)))) };
  }
  let EV = evModel(TESLAS[0]);
  // throttle share (0..1) needed to produce acceleration a (m/s²) at speed v (m/s)
  const throttleFor = (a, v) => Math.max(0, Math.min(1, (a + EV.res(v)) / EV.amax(v)));

  // Virtual 6-speed box stretched over YOUR Tesla's top speed: km/h at redline per gear.
  const GEAR_SPREAD = [0.26, 0.40, 0.54, 0.68, 0.84, 1.0];
  const GEARS = { length: 6 };
  const gearK = gr => EV.T.top * GEAR_SPREAD[gr - 1] / ((state.engine.redline - state.engine.idle * 0.6) / 1000);
  // pops & bangs tune: dur = volley length (ms), gap = spacing between pops (s), big = chance of a loud bang
  const POPCORN = [
    null,
    { dur: 1000, gap: 0.22, big: 0.03, gain: 0.7 },
    { dur: 2400, gap: 0.10, big: 0.14, gain: 1.0 },
  ];

  const $ = id => document.getElementById(id);
  const cv = $('cv'), g = cv.getContext('2d');

  const state = {
    engine: CARS[0], mode: 'gps', running: false, muted: false,
    speed: 0,          // km/h shown & used by sim
    targetSpeed: 0,    // last GPS speed
    accel: 0,          // km/h per second (smoothed)
    throttle: 0,       // 0..1 estimated or from pedal
    rpm: 0, gear: 0,   // gear 0 = N
    shiftUntil: 0, lastShift: 0,
    gas: false, brake: false,
    lastFix: null, fixTime: 0, gpsAcc: null,
    overrunUntil: 0, overrunDur: 1, overrunManual: false, nextPop: 0, crankUntil: 0,
    popLevel: 2, popSource: 'synth', prevRawAccel: 0, engineVolAt: 0,
    latG: 0, heading: null, gTrail: [], gMax: 0,
  };
  const fx = []; // visual flames {t, s, big}
  window.SE = { state, tesla: () => EV.T, setStatus: (t, k) => setStatus(t, k) };

  // ---------- Audio (real engine samples) ----------
  let ac, master, popNoise, lp, engGain;
  let voice = null;               // active engine voice: { layers:[{src,gain,rpm,load}], kind }
  const buffers = {};             // url -> decoded AudioBuffer (cache across cars)
  const loading = {};             // url -> Promise

  function noiseBuffer(sec) {
    const b = ac.createBuffer(1, ac.sampleRate * sec, ac.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return b;
  }

  function loadBuf(url) {
    if (!url) return Promise.resolve(null);
    if (buffers[url]) return Promise.resolve(buffers[url]);
    if (!loading[url]) {
      loading[url] = fetch(url).then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
        .then(ab => new Promise((res, rej) => ac.decodeAudioData(ab, res, rej)))
        .then(b => (buffers[url] = b))
        .catch(() => null);
    }
    return loading[url];
  }
  const carFiles = car => [
    ...(car.sound.layers || []).map(l => l.f),
    ...(car.sound.f ? [car.sound.f] : []),
    car.startup || 'sounds/startup.mp3',
    ...(car.pops || []),
  ];
  function loadCar(car) { return Promise.all(carFiles(car).map(loadBuf)); }

  function initAudio() {
    if (ac) return;
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = +$('vol').value;
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -10; comp.ratio.value = 3; comp.release.value = 0.25;
    master.connect(comp).connect(ac.destination);
    popNoise = noiseBuffer(1);
    engGain = ac.createGain(); engGain.gain.value = 0;
    engGain.connect(master);
  }

  // Build the engine voice. Like racing games: every recorded RPM loop plays at once
  // and we only move the volumes (crossfade by RPM, on-load vs off-load) plus a small
  // pitch correction between recorded points — so the recordings stay untouched.
  function buildVoice() {
    if (!ac) return;
    const car = state.engine;
    if (voice) {
      voice.layers.forEach(l => { try { l.src.stop(); } catch (e) {} });
      if (voice.out) { const o = voice.out; o.gain.setTargetAtTime(0, ac.currentTime, 0.03); setTimeout(() => o.disconnect(), 300); }
    }
    voice = null;
    const t0 = ac.currentTime + 0.03;
    if (car.sound.type === 'ramp') {
      const buf = buffers[car.sound.f]; if (!buf) return;
      const out = ac.createGain(); out.connect(engGain);
      voice = { kind: 'ramp', buf, out, layers: [], next: t0, pos: null };
      return;
    }
    const layers = [];
    for (const L of car.sound.layers) {
      const buf = buffers[L.f]; if (!buf) continue;
      const src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
      if (L.loopStart != null) { src.loopStart = L.loopStart; src.loopEnd = L.loopEnd || buf.duration; }
      const gain = ac.createGain(); gain.gain.value = 0;
      src.connect(gain).connect(engGain);
      src.start(t0, Math.random() * buf.duration * 0.5);
      layers.push({ src, gain, rpm: L.rpm, load: L.load || 'on', vol: L.vol || 1 });
    }
    voice = { layers, kind: car.sound.type };
  }
  function applyEngine() { buildVoice(); }
  function loadPopPool() {
    const pool = window.POP_POOL || { small: [], big: [] };
    return Promise.all([...pool.small, ...pool.big].map(loadBuf));
  }

  function playStartup() {
    const b = buffers[state.engine.startup || 'sounds/startup.mp3'];
    if (!ac || !b) return;
    const s = ac.createBufferSource(); s.buffer = b;
    const gg = ac.createGain(); gg.gain.value = state.muted ? 0 : 1.0;
    s.connect(gg).connect(master); s.start();
  }

  function setP(p, v, tc = 0.03) { p.setTargetAtTime(v, ac.currentTime, tc); }

  // equal-power weights for a set of layers sorted by rpm
  function rpmWeights(set, rpm) {
    const w = new Map();
    if (!set.length) return w;
    if (rpm <= set[0].rpm) { w.set(set[0], 1); return w; }
    const last = set[set.length - 1];
    if (rpm >= last.rpm) { w.set(last, 1); return w; }
    for (let i = 0; i < set.length - 1; i++) {
      const a = set[i], b = set[i + 1];
      if (rpm >= a.rpm && rpm <= b.rpm) {
        const x = (rpm - a.rpm) / (b.rpm - a.rpm);
        w.set(a, Math.cos(x * Math.PI / 2)); w.set(b, Math.sin(x * Math.PI / 2));
        break;
      }
    }
    return w;
  }

  // ---- 'ramp' cars: one real rev recording, played back granularly at the spot that matches the rpm ----
  // map: [[rpm, seconds], ...] for the rising part (on-throttle); mapOff: same for the falling part (optional)
  function rampPos(map, rpm) {
    if (rpm <= map[0][0]) return { t: map[0][1], rate: Math.max(0.8, rpm / map[0][0]) };
    const last = map[map.length - 1];
    if (rpm >= last[0]) return { t: last[1], rate: Math.min(1.12, rpm / last[0]) };
    for (let i = 0; i < map.length - 1; i++) {
      const a = map[i], b = map[i + 1];

    const na = ang(state.rpm);
    g.save(); g.translate(cx, cy); g.rotate(na);
    g.beginPath(); g.moveTo(-R * 0.12, -4); g.lineTo(R * 0.9, -1.5); g.lineTo(R * 0.9, 1.5); g.lineTo(-R * 0.12, 4); g.closePath();
    g.fillStyle = '#ff3b30'; g.shadowColor = '#ff3b30'; g.shadowBlur = 18; g.fill(); g.restore();
    g.shadowBlur = 0;
    g.beginPath(); g.arc(cx, cy, R * 0.26, 0, Math.PI * 2); g.fillStyle = '#0c0d10'; g.fill();
    g.lineWidth = 2; g.strokeStyle = '#2a2f38'; g.stroke();

    // speed + gear
    g.fillStyle = '#ffffff';
    g.font = `800 ${R * 0.24}px -apple-system, Roboto, sans-serif`;
    g.fillText(Math.round(state.speed), cx, cy - R * 0.02);
    g.font = `600 ${R * 0.06}px -apple-system, Roboto, sans-serif`; g.fillStyle = '#7c8594';
    g.fillText('км/ч', cx, cy + R * 0.16);

    g.font = `800 ${R * 0.2}px -apple-system, Roboto, sans-serif`;
    g.fillStyle = state.gear === 0 ? '#31d158' : '#ffb020';
    g.fillText(state.gear === 0 ? 'N' : state.gear, cx, cy + R * 0.8);

    // side bars: throttle (left), g-force (right) — flush to the screen edges
    const bh = Math.max(30, Math.min(R * 1.25, H - topReserve - 28)), by = cy - bh / 2;
    const bx1 = 12, bx2 = W - 12 - bw;
    bar(bx1, by, bw, bh, state.throttle, '#31d158', 'ГАЗ');
    const gForce = state.accel / 3.6 / 9.81;
    bar(bx2, by, bw, bh, Math.min(1, Math.abs(gForce) / 0.8), gForce < 0 ? '#ff3b30' : '#ffb020', (Math.abs(gForce)).toFixed(2) + 'g');

    // G-meter (friction circle) in the free corner left of the gauge
    const gr = Math.min(78, W * 0.085, H * 0.16);
    const gx = bx1 + bw + 22 + gr, gy = H - gr - 26;
    if (gr > 34 && gx + gr + 10 < cx - R * 1.04) drawGMeter(gx, gy, gr);

    drawFlames(now, bang);
  }

  function drawGMeter(x, y, r) {
    const scale = r / 1.2;                         // 1.2 g at the rim
    g.save();
    g.fillStyle = 'rgba(15,17,22,.85)'; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
    g.strokeStyle = '#2a2f38'; g.lineWidth = 1;
    for (const k of [0.5, 1.0]) { g.beginPath(); g.arc(x, y, k * scale, 0, Math.PI * 2); g.stroke(); }
    g.beginPath(); g.moveTo(x - r, y); g.lineTo(x + r, y); g.moveTo(x, y - r); g.lineTo(x, y + r); g.stroke();
    const tr = state.gTrail;
    tr.forEach(([lx, ly], i) => {
      g.fillStyle = `rgba(255,176,32,${(i / tr.length) * 0.5})`;
      g.beginPath(); g.arc(x + lx * scale, y - ly * scale, 2, 0, Math.PI * 2); g.fill();
    });
    const cur = tr[tr.length - 1] || [0, 0], mag = Math.hypot(cur[0], cur[1]);
    state.gMax = Math.max(state.gMax * 0.9995, mag);
    g.fillStyle = '#ff3b30'; g.shadowColor = '#ff3b30'; g.shadowBlur = 10;
    g.beginPath(); g.arc(x + cur[0] * scale, y - cur[1] * scale, 5, 0, Math.PI * 2); g.fill();
    g.shadowBlur = 0;
    g.fillStyle = '#e9edf2'; g.font = `700 ${Math.max(11, r * 0.2)}px -apple-system, Roboto, sans-serif`;
    g.textAlign = 'center'; g.fillText(mag.toFixed(2) + ' g', x, y + r + 14);
    g.fillStyle = '#7c8594'; g.font = `600 ${Math.max(9, r * 0.13)}px -apple-system, Roboto, sans-serif`;
    g.fillText('0.5', x + 0.5 * scale + 9, y - 3); g.fillText('1.0', x + scale - 9, y - 3);
    g.restore();
  }

  // exhaust flames from two "tailpipes" at the bottom edge
  function drawFlames(now, bang) {
    g.save();
    g.globalCompositeOperation = 'lighter';
    const pipes = [W * 0.3, W * 0.7];
    for (const f of fx) {
      const age = (now - f.t) / (f.big ? 300 : 160);
      if (age >= 1) continue;
      const a = (1 - age) * Math.min(1, f.s);
      const len = (f.big ? 0.42 : 0.2 + f.s * 0.12) * H * (0.6 + age * 0.6);
      for (const px of pipes) {
        const jitter = (Math.random() - 0.5) * len * 0.25;
        const gr = g.createRadialGradient(px + jitter, H, 0, px + jitter, H, len);
        gr.addColorStop(0, `rgba(160,200,255,${a})`);
        gr.addColorStop(0.18, `rgba(255,220,120,${a})`);
        gr.addColorStop(0.5, `rgba(255,110,20,${a * 0.75})`);
        gr.addColorStop(1, 'rgba(255,40,0,0)');
        g.fillStyle = gr;
        g.beginPath(); g.ellipse(px + jitter, H, len * 0.45, len, 0, Math.PI, 0); g.fill();
      }
    }
    g.restore();
    if (bang > 0) { g.fillStyle = `rgba(255,120,30,${0.22 * bang})`; g.fillRect(-20, -20, W + 40, H + 40); }
  }

  function bar(x, y, w, h, v, col, label) {
    g.fillStyle = '#15181e'; roundRect(x, y, w, h, w / 2); g.fill();
    const fh = h * v;
    g.fillStyle = col; roundRect(x, y + h - fh, w, fh, w / 2); g.fill();
    g.font = `600 ${Math.max(10, Math.min(14, w * 0.8))}px -apple-system, Roboto, sans-serif`;
    g.fillStyle = '#7c8594'; g.textAlign = 'center';
    g.fillText(label, x + w / 2, Math.min(H - 5, y + h + 16));
  }
  function roundRect(x, y, w, h, r) {
    if (w <= 0 || h <= 0) return;
    r = Math.max(0, Math.min(r, h / 2, w / 2)); g.beginPath();
    g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  }

  // ---------- Controls ----------
  let wakeLock = null;
  async function keepAwake() {
    try { wakeLock = await navigator.wakeLock?.request('screen'); } catch (e) { /* not supported */ }
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && state.running) keepAwake(); });

  function setMode(mode) {
    state.mode = mode;
    $('modeBtn').textContent = 'Режим: ' + (mode === 'gps' ? 'GPS' : 'Демо');
    $('pedals').classList.toggle('show', mode === 'demo');
    if (mode === 'gps') { startGps(); }
    else { stopGps(); setStatus('Демо: держите «ГАЗ» (или ↑ / пробел)', 'ok'); }
  }

  let starting = false;
  async function start(mode) {
    if (starting || state.running) return;
    starting = true;
    initAudio(); ac.resume();
    $('overlay').classList.add('hide');
    setStatus('Загрузка звука мотора…', 'warn');
    await Promise.all([loadCar(state.engine), loadPopPool()]);
    buildVoice();
    playStartup();                              // real ignition sound
    state.engineVolAt = performance.now() + 1000; // let the starter crank before the loop fades in
    state.running = true;
    state.crankUntil = performance.now() + 1100; // visual rev blip while the starter catches
    keepAwake();
    setMode(mode);
    starting = false;
  }

  $('startGps').onclick = () => start('gps');
  $('startDemo').onclick = () => start('demo');
  $('popSel').onchange = e => { state.popLevel = +e.target.value; if (!state.popLevel) state.overrunUntil = 0; };
  $('popBtn').onclick = () => { if (state.running && state.popLevel) triggerOverrun(true); };
  $('modeBtn').onclick = () => { if (!state.running) return; setMode(state.mode === 'gps' ? 'demo' : 'gps'); };
  $('muteBtn').onclick = () => { state.muted = !state.muted; $('muteBtn').textContent = state.muted ? 'Звук выкл' : 'Звук вкл'; $('muteBtn').classList.toggle('on', state.muted); };
  $('vol').oninput = e => { if (master) master.gain.value = +e.target.value; };
  // ---------- wheel picker (like an iOS year picker), shared by sound-car and Tesla choice ----------
  const ITEM_H = 58;
  const wheel = $('wheel');
  let pickIdx = 0, pickCfg = null, items = [];
  function styleWheel() {
    const center = wheel.scrollTop / ITEM_H;
    pickIdx = Math.max(0, Math.min(items.length - 1, Math.round(center)));
    items.forEach((el, i) => {
      const d = i - center, ad = Math.min(3, Math.abs(d));
      el.style.transform = `rotateX(${-d * 17}deg) scale(${1 - ad * 0.05})`;
      el.style.opacity = String(1 - ad * 0.27);
      el.classList.toggle('cur', i === pickIdx);
    });
  }
  let wheelRaf = 0;
  wheel.addEventListener('scroll', () => { cancelAnimationFrame(wheelRaf); wheelRaf = requestAnimationFrame(styleWheel); });
  wheel.addEventListener('click', e => {
    const it = e.target.closest('.wi'); if (!it) return;
    const i = +it.dataset.i;
    if (i === pickIdx) applyPick(); else wheel.scrollTo({ top: i * ITEM_H, behavior: 'smooth' });
  });
  wheel.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      wheel.scrollTo({ top: (pickIdx + (e.key === 'ArrowDown' ? 1 : -1)) * ITEM_H, behavior: 'smooth' });
    } else if (e.key === 'Enter') applyPick();
    else if (e.key === 'Escape') closePicker();
  });
  // cfg: { title, list, current, title1(item), title2(item), apply(item) }
  function openPicker(cfg) {
    pickCfg = cfg;
    $('pickTitle').textContent = cfg.title;
    wheel.innerHTML = cfg.list.map((c, i) =>
      `<div class="wi" data-i="${i}"><b>${cfg.title1(c)}</b><small>${cfg.title2(c) || ''}</small></div>`).join('');
    items = [...wheel.children];
    $('picker').hidden = false;
    wheel.scrollTop = Math.max(0, cfg.list.indexOf(cfg.current)) * ITEM_H; styleWheel();
    wheel.focus({ preventScroll: true });
  }
  function closePicker() { $('picker').hidden = true; }
  function applyPick() { const c = pickCfg && pickCfg.list[pickIdx]; closePicker(); if (c) pickCfg.apply(c); }
  $('pickDone').onclick = applyPick;
  $('pickCancel').onclick = closePicker;
  $('picker').addEventListener('click', e => { if (e.target === $('picker')) closePicker(); });
  const store = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
                  set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };

  // sound car
  const carLabel = c => c.brand + ' ' + c.model;
  function setCarLabel() { $('carName').textContent = carLabel(state.engine); }
  async function selectCar(car) {
    if (car === state.engine) return;
    state.engine = car; setCarLabel(); store.set('car', car.id);
    if (!ac) return;                              // not started yet: loads on Start
    setStatus('Загрузка звука: ' + carLabel(car) + '…', 'warn');
    await Promise.all([loadCar(car), loadPopPool()]);
    if (state.engine !== car) return;             // picked another car meanwhile
    buildVoice();
    state.crankUntil = performance.now() + 500;
    setStatus(carLabel(car), 'ok');
  }
  $('carBtn').onclick = () => openPicker({ title: 'Звук мотора', list: CARS, current: state.engine,
    title1: carLabel, title2: c => c.engineName, apply: selectCar });
  { const saved = store.get('car'); if (saved) state.engine = carById(saved); }
  setCarLabel();

  // your Tesla
  const teslaLabel = T => T.name + ' · ' + T.trim.split(' · ')[0];
  function setTesla(T) {
    EV = evModel(T); store.set('tesla', T.id);
    const txt = teslaLabel(T);
    $('teslaName').textContent = txt; $('teslaName2').textContent = txt;
    state.gear = Math.min(state.gear, 6);
  }
  const pickTesla = () => openPicker({ title: 'Ваша Tesla', list: TESLAS, current: EV.T,
    title1: T => T.name + ' ' + T.trim.split(' · ')[0],
    title2: T => `${T.trim.split(' · ')[1] || ''}${T.trim.includes(' · ') ? ' · ' : ''}0–100 за ${T.t100} с · ${T.kw} кВт · ${T.top} км/ч`,
    apply: setTesla });
  $('teslaBtn').onclick = pickTesla; $('teslaBtn2').onclick = pickTesla;
  setTesla(TESLAS.find(T => T.id === store.get('tesla')) || TESLAS[0]);
  $('viewBtn').onclick = () => {
    const tv = $('trackView'), show = tv.hidden;
    tv.hidden = !show;
    $('viewBtn').textContent = show ? '⏱ Приборка' : '🏁 Трек';
    if (show && window.SE_TRACK) window.SE_TRACK.render();
  };
  $('popSrc').onchange = e => { state.popSource = e.target.value; };
  $('popSel').addEventListener('change', () => { if (window.matchMedia('(max-width: 560px)').matches) closeDrawer(); });
  function closeDrawer() { $('controls').classList.remove('open'); $('gearBtn').classList.remove('on'); setTimeout(resize, 0); }
  $('gearBtn').onclick = () => { const c = $('controls').classList.toggle('open'); $('gearBtn').classList.toggle('on', c); setTimeout(resize, 0); };
  $('fsBtn').onclick = () => {
    const el = document.documentElement;
    if (document.fullscreenElement) document.exitFullscreen?.(); else (el.requestFullscreen || el.webkitRequestFullscreen)?.call(el);
    setTimeout(resize, 150);
  };

  function hold(btn, key) {
    const on = e => { e.preventDefault(); state[key] = true; btn.classList.add('down'); };
    const off = () => { state[key] = false; btn.classList.remove('down'); };
    btn.addEventListener('pointerdown', on);
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => btn.addEventListener(t, off));
  }
  hold($('gas'), 'gas'); hold($('brake'), 'brake');
  window.addEventListener('keydown', e => {
    if (state.mode !== 'demo') return;
    if (e.code === 'ArrowUp' || e.code === 'Space') { state.gas = true; e.preventDefault(); }
    if (e.code === 'ArrowDown') state.brake = true;
  });
  window.addEventListener('keyup', e => {
    if (e.code === 'ArrowUp' || e.code === 'Space') state.gas = false;
    if (e.code === 'ArrowDown') state.brake = false;
  });

  resize();
  requestAnimationFrame(step);
})();
</script>
<script src="track.js"></script>
</body>
</html>
